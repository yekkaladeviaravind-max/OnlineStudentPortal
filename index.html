<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal | Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="brand-mark">SP</div>
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Student Portal</h1>
    <p class="muted">Sign in to access your student dashboard.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>

      <button type="submit">Login</button>
    </form>

    <p id="message" class="message" role="status"></p>
    <p class="switch-link">New student? <a href="register.html">Create an account</a></p>
  </main>
</body>
</html>
